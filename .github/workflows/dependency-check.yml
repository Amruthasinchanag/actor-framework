name: Dependency CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      feed_only:
        description: Validate a version-feed-only publication branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-check:
    name: dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the feed-only scope
        if: github.head_ref == 'automation/vipm-release-feed' || inputs.feed_only
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_BRANCH...HEAD")
          if [ "$changed" != 'Tooling/deployment/vipm-releases.json' ]; then
            echo 'Feed-only CI accepts changes to Tooling/deployment/vipm-releases.json only'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
        env:
          REQUIRE_VIPM_LOCK: ${{ github.event_name != 'push' && github.head_ref != 'automation/vipm-release-feed' && !inputs.feed_only }}