name: Test LabVIEW Setup and Activation

on:
  workflow_dispatch:

jobs:
  setup-and-activate-labview:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Step 1: Setup NIPM
      - name: Setup NI Package Manager
        uses: KSharma-NI/open-source/setup-nipm@users/krishsha/setup-nipm
        with:
          log_level: 'DEBUG'
      
      # Step 2: Install LabVIEW
      - name: Setup LabVIEW
        uses: KSharma-NI/open-source/setup-labview@users/krishsha/download-labview
        with:
          labview_iso_url: 'https://download.ni.com/support/softlib/labview/labview_development_system/2025_Q3/ni-labview-2025-community-x86_25.3.3_offline.iso'
          timeout_seconds: 1800
          log_level: 'DEBUG'
      
      # Step 3: Activate LabVIEW
      - name: Activate LabVIEW
        uses: KSharma-NI/open-source/activate-labview@users/krishsha/activate-labview
        with:
          serial_number: ${{ secrets.LABVIEW_SERIAL_NUMBER }}
          package_id: 'LabVIEW_COM_PKG 25.0300'
          log_level: 'DEBUG'
      
      # Step 4: Verify activation
      - name: Verify LabVIEW is activated
        shell: pwsh
        run: |
          Write-Host "=== Verifying LabVIEW Installation ==="
          
          $lvPath = "C:\Program Files\National Instruments\LabVIEW 2025"
          if (Test-Path $lvPath) {
            Write-Host "LabVIEW installed at $lvPath"
          } else {
            Write-Error "LabVIEW not found"
          }
      
      # Step 5: Configure LabVIEW (add after activation)
      - name: Configure LabVIEW
        uses: KSharma-NI/open-source/configure-labview@users/krishsha/configure-labview
        with:
          labview_version: '2025'
          log_level: 'DEBUG'

      # Step 6: Verify configuration
      - name: Verify LabVIEW configuration
        shell: pwsh
        run: |
          $iniPath = "C:\Program Files (x86)\National Instruments\LabVIEW 2025\LabVIEW.ini"
          
          if (Test-Path $iniPath) {
            Write-Host "LabVIEW.ini found"
            
            $content = Get-Content $iniPath
            
            # Check for TCP settings
            if ($content -match "server.tcp.enabled=TRUE") {
              Write-Host "TCP server enabled"
            }
            
            # Check for scripting
            if ($content -match "server.viscripting.ShowScriptingOperationsInEditor=TRUE") {
              Write-Host "VI Scripting enabled"
            }
          } else {
            Write-Error "LabVIEW.ini not found"
          }

      # Step 7: Setup config files for VIPM
      - name: Setup VIPM Configuration
        shell: pwsh
        run: |
          Write-Host "=== Setting up VIPM Configuration Files ==="
          $jkiDir = "C:\ProgramData\JKI"
          $vipmDir = "C:\ProgramData\JKI\VIPM"
          
          # Create directories
          if (-not (Test-Path $jkiDir)) {
            New-Item -ItemType Directory -Path $jkiDir -Force | Out-Null
            Write-Host "Created JKI directory"
          } else {
            Write-Host "JKI directory already exists"
          }
          
          if (-not (Test-Path $vipmDir)) {
            New-Item -ItemType Directory -Path $vipmDir -Force | Out-Null
            Write-Host "Created VIPM directory"
          } else {
            Write-Host "VIPM directory already exists"
          }
          
          # Write jki.conf from secret
          $jkiConfPath = Join-Path $jkiDir "jki.conf"
          $jkiConf = @'
          ${{ secrets.JKI_CONF }}
          '@
          Set-Content -Path $jkiConfPath -Value $jkiConf -Force -Encoding UTF8
          Write-Host "Created jki.conf"
          
          # Write Settings.ini from secret
          $settingsIniPath = Join-Path $vipmDir "Settings.ini"
          $settingsIni = @'
          ${{ secrets.VIPM_SETTINGS_INI }}
          '@
          Set-Content -Path $settingsIniPath -Value $settingsIni -Force -Encoding UTF8
          Write-Host "Created Settings.ini"
          
          # Verify files exist`
          if ((Test-Path $jkiConfPath) -and (Test-Path $settingsIniPath)) {
            Write-Host "VIPM configuration files created successfully"
          } else {
            Write-Error "Failed to create VIPM configuration files"
          }
      
      # Step 8: Setup LUnit for G-CLI
      - name: Setup LUnit for G-CLI
        uses: KSharma-NI/open-source/setup-lunit@users/krishsha/install-lunit
        with:
          lv_version: '2025'
          lv_bitness: '32'
          log_level: 'DEBUG'

      # Step 9: Verify LUnit installation
      - name: Verify LUnit and VIPM installation
        shell: pwsh
        env:
          LV_VERSION: '2025'
          LV_BITNESS: '32'
        run: |
          Write-Host "=== Verifying VIPM Installation ==="
          
          $vipmExe = "C:\Program Files\JKI\VI Package Manager\support\vipm.exe"
          if (Test-Path $vipmExe) {
            Write-Host "VIPM found at $vipmExe"
            
            # Check VIPM version
            & $vipmExe --version
          } else {
            Write-Error "VIPM not found"
          }
          
          Write-Host "`n=== Checking Installed Packages ==="
          & $vipmExe list --installed --labview-version $env:LV_VERSION --labview-bitness $env:LV_BITNESS
      
      - name: Run LabVIEW Unit Tests
        uses: KSharma-NI/open-source/run-unit-tests@users/krishsha/run-unit-tests
        with:
          minimum_supported_lv_version: '2025'
          supported_bitness: '32'
          project_path: 'Core\Actor Framework Core.lvproj'
          open_project_before_run: false
          log_level: 'DEBUG'