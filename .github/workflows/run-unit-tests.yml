name: Run unit tests

on:
  pull_request:
    branches:
      - main
      - releases/*
      - feature/*
      - hotfix/*
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  push:
    branches:
      - main
      - releases/*
      - hotfix/*
      - feature/*

  workflow_dispatch:

jobs:
  run-unit-tests:
    name: Run unit tests
    permissions:
      contents: read
    uses: ./.github/workflows/lunit-container-tests.yml
