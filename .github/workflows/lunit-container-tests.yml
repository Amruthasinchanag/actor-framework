name: LUnit Tests on LV Container

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunit-container-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LABVIEW_IMAGE: nationalinstruments/labview:2026q1patch1-linux
  AF_CONTAINER_NAME: af-lunit-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  lunit-tests:
    name: Run LUnit tests (Linux container)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Check PR trust boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork PRs cannot access VIPM Pro credentials. A maintainer must review and push changes to a trusted branch. Do not use pull_request_target to run fork code with secrets."
          exit 1

      - name: Checkout source and migrated tests
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check VIPM activation configuration
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: |
          for name in VIPM_SERIAL_NUMBER VIPM_FULL_NAME VIPM_EMAIL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret is missing: $name"
              exit 1
            fi
          done

      - name: Pull and inspect Linux LabVIEW image
        run: |
          [[ "$(docker info --format '{{.OSType}}')" == linux ]] || {
            echo "::error::A running Docker engine in Linux-container mode is required."
            exit 1
          }
          docker pull "$LABVIEW_IMAGE"
          docker image inspect "$LABVIEW_IMAGE" > "$RUNNER_TEMP/labview-image.json"
          jq -e '.[0] | .Os == "linux" and .Architecture == "amd64"' "$RUNNER_TEMP/labview-image.json"
          lv_year=$(jq -er '.[0].Config.Env[] | select(test("^LV_YEAR=[0-9]{4}$")) | sub("^LV_YEAR="; "")' "$RUNNER_TEMP/labview-image.json")
          echo "LV_YEAR=$lv_year" >> "$GITHUB_ENV"

      - name: Start container and copy bootstrap script
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lunit-results"
          echo "Starting Linux container $AF_CONTAINER_NAME" > "$GITHUB_WORKSPACE/lunit-results/container-lifecycle.log"
          docker create --name "$AF_CONTAINER_NAME" --user root --entrypoint /bin/bash \
            "$LABVIEW_IMAGE" -c "sleep 7200"
          echo "AF_CONTAINER_CREATED=true" >> "$GITHUB_ENV"
          docker start "$AF_CONTAINER_NAME"
          docker exec "$AF_CONTAINER_NAME" mkdir -p /unit-test-results
          docker cp "$GITHUB_WORKSPACE/pipeline/scripts/invoke-lunit-container.sh" \
            "$AF_CONTAINER_NAME:/invoke-lunit-container.sh"

      - name: Install VIPM and LUnit inside container
        timeout-minutes: 25
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: |
          docker exec \
            -e VIPM_SERIAL_NUMBER -e VIPM_FULL_NAME -e VIPM_EMAIL \
            -e LV_YEAR \
            "$AF_CONTAINER_NAME" bash /invoke-lunit-container.sh setup

      - name: Restart container and copy source
        run: |
          # Discard the LabVIEW instance used by VIPM before starting LabVIEW CLI.
          docker restart "$AF_CONTAINER_NAME"
          docker exec "$AF_CONTAINER_NAME" mkdir -p /actor-framework
          docker cp "$GITHUB_WORKSPACE/." "$AF_CONTAINER_NAME:/actor-framework"

      - name: Run LUnit through native LabVIEW CLI
        id: run-tests
        timeout-minutes: 20
        run: |
          docker exec -e LV_YEAR "$AF_CONTAINER_NAME" bash /invoke-lunit-container.sh test

      - name: Collect container reports and logs
        if: always() && env.AF_CONTAINER_CREATED == 'true'
        run: |
          set +e
          docker logs "$AF_CONTAINER_NAME" > "$GITHUB_WORKSPACE/lunit-results/docker.log" 2>&1
          log_status=$?
          docker cp "$AF_CONTAINER_NAME:/unit-test-results/." "$GITHUB_WORKSPACE/lunit-results" \
            2>> "$GITHUB_WORKSPACE/lunit-results/container-lifecycle.log"
          copy_status=$?
          if (( log_status != 0 || copy_status != 0 )); then
            echo "::error::Log collection failed (docker logs: $log_status, docker cp: $copy_status). See container-lifecycle.log."
            exit 1
          fi

      - name: Validate JUnit report and test discovery
        if: ${{ !cancelled() && steps.run-tests.outcome == 'success' }}
        shell: pwsh
        run: |
          $result = & ./pipeline/scripts/Assert-LUnitReport.ps1 `
            -ReportPath "$env:GITHUB_WORKSPACE/lunit-results/lunit.xml" -MinimumTests 13
          "LUnit: $($result.Executed) tests executed; $($result.Skipped) skipped." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload LUnit reports and logs
        if: always() && env.AF_CONTAINER_CREATED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lunit-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lunit-results
          if-no-files-found: error
          retention-days: 7

      - name: Remove LabVIEW container
        if: always() && env.AF_CONTAINER_CREATED == 'true'
        run: docker rm -f "$AF_CONTAINER_NAME"
